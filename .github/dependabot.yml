version: 2

updates:
  # npm dependencies
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Ho_Chi_Minh
    open-pull-requests-limit: 10
    labels:
      - dependencies
    groups:
      # Group minor/patch updates together to reduce PR noise
      tanstack:
        patterns:
          - '@tanstack/*'
      tailwind:
        patterns:
          - 'tailwindcss'
          - '@tailwindcss/*'
      eslint:
        patterns:
          - 'eslint*'
          - '@eslint/*'
          - 'typescript-eslint'
      testing:
        patterns:
          - 'vitest'
          - '@testing-library/*'
          - 'jsdom'
      minor-and-patch:
        update-types:
          - minor
          - patch
        exclude-patterns:
          - '@tanstack/*'
          - 'tailwindcss'
          - '@tailwindcss/*'
          - 'eslint*'
          - '@eslint/*'
          - 'typescript-eslint'
          - 'vitest'
          - '@testing-library/*'
          - 'jsdom'

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels:
      - ci
